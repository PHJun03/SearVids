services:
  backend:
    build: ./SearvidsServer
    container_name: searvids-backend
    ports:
      - "8080:8080"
    volumes:
      # Mount local folder containing model files into the container
      - ./models:/app/models
      # Downloaded video storage
      - ./data:/app/data
    environment:
      - MODEL_PATH=/app/models
      - WHISPER_MODEL_SIZE=base
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    restart: always

  frontend:
    build: ./searvids-client
    container_name: searvids-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always