services:
  backend:
    build: ./SearvidsServer
    container_name: searvids-backend
    ports:
      - "8080:8080"
    volumes:
      # Mount local folder containing model files into the container
      - ./models:/app/models
      # Downloaded video storage
      - ./data:/app/data
    environment:
      - MODEL_PATH=/app/models
      - WHISPER_MODEL_SIZE=base
      - POSTGRES_USER=searvids_user
      - POSTGRES_PASSWORD=searvids_pass
      - POSTGRES_DB=searvids_db
      - DB_HOST=db
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    depends_on:
      - db
    restart: always

  frontend:
    build: ./searvids-client
    container_name: searvids-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

  db:
    image: postgres:15-alpine
    container_name: searvids-db
    restart: always
    environment:
      POSTGRES_USER: searvids_user
      POSTGRES_PASSWORD: searvids_pass
      POSTGRES_DB: searvids_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: