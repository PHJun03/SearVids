services:
  backend:
    build: ./SearvidsServer
    container_name: searvids-backend
    ports:
      - "8080:8080"
    volumes:
      # Mount local folder containing model files into the container
      - ./models:/app/models
      # Downloaded video storage
      - ./data:/app/data
    environment:
      - MODEL_PATH=/app/models
      - WHISPER_MODEL_SIZE=base
      - USE_GPU=true
      # DataImpulse Residential Proxy
      # - HTTP_PROXY=http://
      - POSTGRES_USER=searvids_user
      - POSTGRES_PASSWORD=searvids_pass
      - POSTGRES_DB=searvids_db
      - DB_HOST=db
      - WHISPER_URL=http://whisper-worker:5000
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [ gpu ]
    depends_on:
      - db
    restart: always

  frontend:
    build: ./searvids-client
    container_name: searvids-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

  whisper-worker:
    build: ./SearvidsServer
    container_name: searvids-whisper
    command: [ "python3", "/app/whisper_server.py" ]
    volumes:
      - ./models:/app/models
    environment:
      - MODEL_PATH=/app/models
      - WHISPER_MODEL_SIZE=base
      - USE_GPU=true
      - OMP_NUM_THREADS=4
      - CT2_OMP_NUM_THREADS=4
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [ gpu ]
        limits:
          cpus: '2.0'
          memory: 2G
    restart: always

  db:
    image: postgres:15-alpine
    container_name: searvids-db
    restart: always
    environment:
      POSTGRES_USER: searvids_user
      POSTGRES_PASSWORD: searvids_pass
      POSTGRES_DB: searvids_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
