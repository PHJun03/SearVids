services:
  backend:
    build:
      context: .
      dockerfile: SearvidsServer/Dockerfile.local
    container_name: searvids-backend
    ports:
      - "8080:8080"
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    environment:
      - MODEL_PATH=/app/models
      - WHISPER_MODEL_SIZE=base
      - POSTGRES_USER=searvids_user
      - POSTGRES_PASSWORD=searvids_pass
      - POSTGRES_DB=searvids_db
      - DB_HOST=db
      - USE_GPU=false # Explicitly disable GPU
      - WHISPER_URL=http://whisper-worker:5000
    depends_on:
      - db
    restart: always

  frontend:
    build: ./searvids-client
    container_name: searvids-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

  whisper-worker:
    build:
      context: .
      dockerfile: SearvidsServer/Dockerfile.local
    container_name: searvids-whisper
    command: [ "python3", "/app/whisper_server.py" ]
    volumes:
      - ./models:/app/models
    environment:
      - MODEL_PATH=/app/models
      - WHISPER_MODEL_SIZE=base
      - USE_GPU=false
      - OMP_NUM_THREADS=4
      - CT2_OMP_NUM_THREADS=4
    restart: always

  db:
    image: postgres:15-alpine
    container_name: searvids-db
    restart: always
    environment:
      POSTGRES_USER: searvids_user
      POSTGRES_PASSWORD: searvids_pass
      POSTGRES_DB: searvids_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
